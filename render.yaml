services:
  - type: web
    name: transaction-ledger-api
    runtime: node
    buildCommand: npm install && npm run build && node dist/config/migrate.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: ledger-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ledger-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ledger-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ledger-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ledger-db
          property: password

databases:
  - name: ledger-db
    databaseName: ledger_db
    user: ledger_user